name = "family-order-relay"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[kv_namespaces]]
binding = "MAILBOX"
id = "8d725206d8dc426cbe12c578bb6597bc"

[vars]
# Fine tune as needed; KV namespaces have per-writer limits, so keep the
# per-minute cap modest for a family-sized mailbox.
RATE_LIMIT_PER_MINUTE = "120"

[triggers]
crons = ["0 */6 * * *"]
